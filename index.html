<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>M&amp;M Car Clinic</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside class="sidebar no-print" id="topbar" hidden>
    <a href="#/day" class="brand">
      <img src="assets/logo.png" alt="" width="28" height="28">
      <span>M&amp;M Car Clinic</span>
      <span class="demo-badge">Demo</span>
    </a>
    <nav aria-label="Main">
      <a href="#/day" data-route="day">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h8.5a1.5 1.5 0 0 1 1.5 1.5v9.5H4.5A1.5 1.5 0 0 1 3 12V2.5Z"/><path d="M3 12a1.5 1.5 0 0 1 1.5-1.5H13M6 5.5h4"/></svg>
        <span>Daily</span>
      </a>
      <a href="#/month" data-route="month">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5h11M4.5 11V7.5M8 11V4M11.5 11V9"/></svg>
        <span>Monthly</span>
      </a>
      <a href="#/inventory" data-route="inventory">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5 8 2.5 13.5 5v6L8 13.5 2.5 11V5Z"/><path d="M2.5 5 8 7.5 13.5 5M8 7.5v6"/></svg>
        <span>Inventory</span>
      </a>
      <a href="#/salary" data-route="salary">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c.5-2.5 2.3-4 4.5-4s4 1.5 4.5 4M10.5 3.2a2.5 2.5 0 0 1 0 4.6M12 9.8c1.3.5 2.2 1.8 2.5 3.7"/></svg>
        <span>Salary</span>
      </a>
      <a href="#/settings" data-route="settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </aside>
  <main id="view"></main>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
